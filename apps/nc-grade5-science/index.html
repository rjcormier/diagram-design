  const D = ["Mon","Tue","Wed","Thu","Fri"], P = [30.21,30.08,29.90,29.58,29.95];
  el.innerHTML = `<p>A class in Raleigh read the barometer at 8 a.m. each day (inches of mercury). <span class="muted">(Example class data.)</span></p>
   <div class="panel chartwrap" id="bChart"></div>
   <div class="tablewrap"><table class="data"><thead><tr><th>Day</th>${D.map(d => `<th>${d}</th>`).join("")}</tr></thead><tbody><tr><td>Pressure (in.)</td>${P.map(p => `<td>${p.toFixed(2)}</td>`).join("")}</tr></tbody></table></div>
   <div class="panel"><div class="eyebrow">Forecast from the data</div>
     <div class="row"><label for="bq1">1. How much did pressure drop from Monday to Thursday? ___ in.</label><input id="bq1" type="text" inputmode="decimal"></div>
     <div class="row"><label for="bq2">2. Between which two days did it fall the most?</label><select id="bq2"><option value="">Choose…</option><option>Mon–Tue</option><option>Tue–Wed</option><option>Wed–Thu</option></select></div>
     <div class="row"><label for="bq3">3. Thursday's weather was most likely…</label><select id="bq3"><option value="">Choose…</option><option value="s">clear and sunny</option><option value="r">cloudy, windy, rainy</option></select></div>
     <div class="row"><label for="bq4">4. Friday the pressure is rising. Expect…</label><select id="bq4"><option value="">Choose…</option><option value="c">clearing skies</option><option value="h">a hurricane</option></select></div>
     <div class="row"><button class="btn primary" id="bCheck">Check</button></div><div id="bFb" class="fb" hidden></div></div>`;
  $("#bChart", el).innerHTML = lineChart({xMin:0,xMax:4,xStep:1,yMin:29.4,yMax:30.4,yStep:0.2,xFmt:i => D[i],yFmt:y => y.toFixed(1),xLabel:"Day",yLabel:"Pressure (in.)",series:[{name:"Pressure",cls:"s1",pts:P.map((p,i) => [i,p])}],aria:"Barometric pressure over five days"}).svg;
  $("#bCheck", el).addEventListener("click", () => {
    const r = [near(parseNum($("#bq1", el).value),0.63,0.001), $("#bq2", el).value === "Wed–Thu", $("#bq3", el).value === "r", $("#bq4", el).value === "c"];
    feedback($("#bFb", el), r.every(Boolean), [r[0]?"1 ✓ 30.21 − 29.58 = 0.63":"1 ✗ line up the decimal points: 30.21 − 29.58", r[1]?"2 ✓ 29.90 − 29.58 = 0.32, the biggest drop":"2 ✗ subtract each pair of days and compare", r[2]?"3 ✓ low pressure = unsettled weather":"3 ✗ what does low pressure bring?", r[3]?"4 ✓ rising pressure = high pressure moving in":"4 ✗ rising pressure usually means improving weather"].join("<br>"));
    if(r.every(Boolean)) mark(objId, "lab");
  });
}};

/* Sea breeze: ESS.5.1.3 */
LABS.breeze = {title:"Sea Breeze / Land Breeze Model", tag:"Model", mount(el, objId){
  let day = true;
  el.innerHTML = `<div class="row"><button class="btn sel" id="bzD">Daytime</button><button class="btn" id="bzN">Nighttime</button></div><div class="panel"><svg viewBox="0 0 520 220" class="chart" id="bzSvg" role="img"></svg><p id="bzTxt"></p></div>
   <div class="panel"><label for="bzQ">At 2 p.m. on Wrightsville Beach, a kite flies toward the dunes. Which breeze is it?</label><div class="row"><select id="bzQ"><option value="">Choose…</option><option value="s">Sea breeze</option><option value="l">Land breeze</option></select><button class="btn primary" id="bzC">Check</button></div><div id="bzFb" class="fb" hidden></div></div>`;
  function draw(){
    const landT = day ? "warmer" : "cooler", seaT = day ? "cooler" : "warmer";
    const dir = day ? -1 : 1; // surface wind: day blows sea(right)→land(left)
    const arrow = (x1,y1,x2,y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(--sky);stroke-width:4;stroke-linecap:round" marker-end="url(#ah)"/>`;
    let g = `<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--sky)"/></marker></defs>`;
    g += `<rect x="0" y="0" width="520" height="220" style="fill:${day?'var(--sky-soft)':'var(--grid)'}"/>`;
    g += `<circle cx="${day?60:470}" cy="34" r="18" style="fill:${day?'var(--sun)':'var(--ink-2)'}"/>`;
    g += `<rect x="0" y="170" width="260" height="50" style="fill:var(--sun-soft)"/><rect x="260" y="176" width="260" height="44" style="fill:var(--s1);opacity:.55"/>`;
    g += `<text x="130" y="200" text-anchor="middle">LAND · ${landT}</text><text x="390" y="204" text-anchor="middle">OCEAN · ${seaT}</text>`;
    if(day){ g += arrow(400,150,180,150) + arrow(130,150,130,70) + arrow(160,60,380,60) + arrow(400,70,400,140); g += `<text x="290" y="142" text-anchor="middle">sea breeze</text><text x="100" y="110" text-anchor="end">warm air rises</text>`; }
    else { g += arrow(130,150,370,150) + arrow(400,150,400,70) + arrow(370,60,150,60) + arrow(130,70,130,140); g += `<text x="250" y="142" text-anchor="middle">land breeze</text><text x="420" y="110">warm air rises</text>`; }
    $("#bzSvg", el).innerHTML = g;
    $("#bzSvg", el).setAttribute("aria-label", day ? "Daytime: land is warmer, air rises over land, cool surface wind blows from sea to land" : "Night: ocean is warmer, air rises over the ocean, surface wind blows from land to sea");
    $("#bzTxt", el).textContent = day ? "In the day, land heats faster than water. Warm air over land rises, and cooler air from the ocean rushes in to replace it: a sea breeze." : "At night, land cools faster than water. Now the air over the ocean is warmer and rises, so air flows from land out to sea: a land breeze.";
    $("#bzD", el).classList.toggle("sel", day); $("#bzN", el).classList.toggle("sel", !day);
  }
  $("#bzD", el).addEventListener("click", () => { day = true; draw(); });
  $("#bzN", el).addEventListener("click", () => { day = false; draw(); mark(objId, "lab"); });
  $("#bzC", el).addEventListener("click", () => { const ok = $("#bzQ", el).value === "s"; feedback($("#bzFb", el), ok, ok ? "Yes! In the afternoon the land is warmer, so the breeze blows from the sea toward land." : "Think: in the afternoon, which is warmer, land or sea? The wind blows toward the warmer side."); if(ok) mark(objId, "lab"); });
  draw();
}};

/* Particle model: ESS.5.1.4 */
LABS.particles = {title:"Particle Model: add or remove the sun's energy", tag:"Model · states of matter", mount(el, objId){
  el.innerHTML = `<div class="twocol"><div class="panel"><canvas id="pc" width="420" height="260" aria-label="Water particles moving in a container"></canvas></div>
   <div class="panel"><label for="pt" class="eyebrow">Energy (temperature)</label><input type="range" id="pt" min="-20" max="120" value="20"><div class="mono" id="ptv"></div><p id="pst"></p></div></div>`;
  const cv = $("#pc", el), ctx = cv.getContext("2d"), N = 36;
  const css = getComputedStyle(document.documentElement);
  const ps = Array.from({length:N}, (_,i) => ({hx: 150 + (i%6)*24, hy: 120 + Math.floor(i/6)*22, x:0, y:0, vx:0, vy:0}));
  ps.forEach(p => { p.x = p.hx; p.y = p.hy; });
  let T = 20, raf, reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function state(){ return T < 0 ? "solid" : T < 100 ? "liquid" : "gas"; }
  function label(){ $("#ptv", el).textContent = `${T} °C · ${state()}`;
    $("#pst", el).textContent = state()==="solid" ? "Ice: particles are packed close and only vibrate in place." : state()==="liquid" ? "Liquid water: particles move faster and slide past each other. Add more energy and some escape as vapor (evaporation)." : "Water vapor: particles move fast and spread far apart. It's an invisible gas. Remove energy and they condense back into droplets."; }
  function step(){
    if(!cv.isConnected) return;
    const st = state(), sp = st==="solid" ? 0.6 : st==="liquid" ? 1.6 + T/50 : 3 + (T-100)/15;
    ctx.fillStyle = css.getPropertyValue("--card").trim() || "#fff"; ctx.fillRect(0,0,420,260);
    ctx.strokeStyle = css.getPropertyValue("--ink-2").trim() || "#555"; ctx.lineWidth = 2; ctx.strokeRect(1,1,418,258);
    ps.forEach(p => {
      if(st === "solid"){ p.x = p.hx + (Math.random()-.5)*2*sp; p.y = p.hy + (Math.random()-.5)*2*sp; p.vx = (Math.random()-.5)*2; p.vy = (Math.random()-.5)*2; }
      else {
        const k = Math.hypot(p.vx,p.vy) || 1; p.vx = p.vx/k*sp + (Math.random()-.5)*.4; p.vy = p.vy/k*sp + (Math.random()-.5)*.4;
        if(st === "liquid") p.vy += 0.35;
        p.x += p.vx; p.y += p.vy;
        const top = st === "liquid" ? 150 : 10;
        if(p.x < 10){ p.x = 10; p.vx = Math.abs(p.vx); } if(p.x > 410){ p.x = 410; p.vx = -Math.abs(p.vx); }
        if(p.y < top){ p.y = top; p.vy = Math.abs(p.vy); } if(p.y > 250){ p.y = 250; p.vy = -Math.abs(p.vy); }
      }
      ctx.beginPath(); ctx.arc(p.x,p.y,7,0,Math.PI*2); ctx.fillStyle = css.getPropertyValue("--s1").trim() || "#2f7fb8"; ctx.fill();
    });
    if(!reduce) raf = requestAnimationFrame(step);
  }
  $("#pt", el).addEventListener("input", e => { T = +e.target.value; label(); if(T >= 100 || T < 0) mark(objId, "lab"); if(reduce) step(); });
  label(); step();
  const stop = () => cancelAnimationFrame(raf); window.addEventListener("hashchange", stop, {once:true});
}};

  let armed = false;
  $("#resetAll").addEventListener("click", e => {
    if(!armed){ armed = true; e.target.textContent = "Tap again to confirm reset"; return; }
    progress = {}; save(); updateStarTotal(); e.target.textContent = "Reset stars on this device"; armed = false; $("#resetMsg").textContent = "Stars cleared.";
  });
  window.scrollTo(0,0);
}

function route(){
  const hsh = decodeURIComponent(location.hash.slice(1));
  if(OBJ_BY_ID[hsh]) renderObjective(hsh);
  else if(hsh === "teacher") renderTeacher();
  else renderHome();
}
window.addEventListener("hashchange", route);
updateStarTotal(); route();
</script>
</body>
</html>
